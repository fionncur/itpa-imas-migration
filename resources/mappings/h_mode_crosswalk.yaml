resolve:
  # There is no evidence for which is right in conflicting cases; `max` at
  # least makes the choice deterministic and independent of slice order.
  DIVNAME:
    strategy: max
  WALMAT:
    strategy: max
  # EVAP disagrees on three pulses (D3D 82205, MAST 8246, MAST 8414) and in
  # every case the competing value is the placeholder NONE.
  EVAP:
    strategy: avoid
    avoid:
    - NONE
  # 51 pulses carry more than one update date; the latest is the current one.
  LCUPDATE:
    strategy: max
  # Two pulses (COMPASS 22059, JFT2M 32609) carry shot dates one day apart.
  DATE:
    strategy: max
